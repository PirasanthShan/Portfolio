<div class="navbar">
  
<div class="underElementNav">

        <div class="logoCtn">
          <a [routerLink]="'/'">
            <img src="./assets/img/LogoName.webp" alt="">
          </a>
        </div>

        <div class="translateMenu">
          <span 
            [ngClass]="{
              'black-border': selectedLang === 'DE' && borderState === 'black',
              'green-border': selectedLang === 'DE' && borderState === 'green'
            }"
            (click)="setLang('DE')"
          >DE</span>
        
          <span 
            [ngClass]="{
              'black-border': selectedLang === 'EN' && borderState === 'black',
              'green-border': selectedLang === 'EN' && borderState === 'green'
            }"
            (click)="setLang('EN')"
          >EN</span>
        
          <img [src]="currentFrame" alt="Burger Menü" (click)="toggleMenuIcon()">
        </div>
      </div>

      <div class="dropDownMenu" #dropDownMenu [class.open]="isOpen">
        <span class="aboutMe">
          <a href="#aboutme"  (click)="goToSection('aboutme')">{{ 'aboutMe' | translate }}</a>
        </span>
        <span class="aboutMe">
          <a href="#myskills" (click)="goToSection('myskills')">{{ 'mySkills' | translate }}</a>
        </span>
        <span class="aboutMe">
          <a href="#portfolio" (click)="goToSection('portfolio')">{{ 'portfolio' | translate }}</a>
        </span>

        <div class="emailIconSection">
          <div class="emailCtn"> 
            <span>{{ 'sayHi' | translate }}</span>
            <p class="email">pirasanth&#64;live.de</p>
          </div>
          
        <div class="imgCtn">
          <a href="https://github.com/PirasanthShan" target="_blank" rel="noopener noreferrer">
            <img class="imgGitHub" src="./assets/img/Github.webp" alt="GitHub">
          </a>

          <a href="mailto:deine.email@adresse.de">
            <img class="imgEmail" src="./assets/img/Email.webp" alt="Email">
          </a>

          <a href="https://www.linkedin.com/in/pirasanth-shanmuganathan-282b91381/" target="_blank" rel="noopener noreferrer">
            <img class="inImg" src="./assets/img/in.webp" alt="LinkedIn">
          </a>
        </div>

        </div>

</div>

</div>
