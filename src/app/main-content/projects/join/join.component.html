<div class="projectsCtn">

  <div class="imgWrapper">
    <div class="frame">
      <img src="./assets/img/ArrowButton.webp" alt="Arrow" class="arrow-icon">
    </div>
    <img  width="700"
          height="400" 
          [src]="project.imgSrc" 
          [alt]="project.title">
  </div>

  <div>
    <p>{{ project.id }}</p>
    <div class="textCtn">
      <h1>{{ project.title }}</h1>
      <h2>{{ project.technologies }}</h2>
      <h3>{{ project.description }}</h3>
      <div class="btnCtn">
        <a href="https://github.com/VasIndo/Join292"><button>Github</button></a>
        <a href="https://pirasanth-shanmuganathan.developerakademie.net/Join292/login.html"><button>Live Test</button></a>
      </div>
    </div>
  </div>

</div>
