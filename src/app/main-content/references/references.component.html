<section>
  <div class="headCtn">
    <h1>{{ translation.getTranslation('references') }}</h1>
    <p>{{ translation.getTranslation('referencesText') }}</p>
  </div>

  <div class="referencesContainer">
    <div class="referenceBox" *ngFor="let ref of references">
      <img src="./assets/img/dots.webp" alt="">
      <h2>{{ ref.name }}</h2>
      <h3>{{ ref.role }}</h3>
      <h4>{{ ref.quote[translation.currentLanguage] }}</h4>
    </div>
  </div>
</section>
